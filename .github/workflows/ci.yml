name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    # no downloads and no database: lint, unit tests, SQL compile on an empty DuckDB,
    # and the Tableau workbook rebuilt from the committed CSV marts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tableau tests
      - name: Compile
        run: python -m compileall -q src tableau tests docs
      - name: Tests
        run: pytest -q
      - name: Build Tableau workbook from data/marts
        run: python tableau/build_story.py
